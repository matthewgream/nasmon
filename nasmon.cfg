
# nasmon -- check a NAS's RAID arrays, disk temperatures and volume usage over ssh; publish to MQTT.
# Installed as /etc/default/nasmon; a per-host nasmon.<hostname>.cfg is used instead when present.

# the NAS: its name (in the topic and in alert names), ssh host and login
name=nas
host=nas.local
username=admin
# password login, through sshpass; leave empty to log in with root's ssh key instead
password=CHANGEME

# array-<md>=<count>: active members expected, when fewer than the array's own member count
# (QNAP's system arrays span every bay, so in a part-filled NAS they always look short)
#array-md9=3
#array-md13=3

# drive bays to read temperatures from (QNAP's get_hd_temp), and the temperature that counts as hot
bays=4
temp-hot=50
# volume usage, in percent, that counts as full
usage-full=90

mqtt-server=mqtt://localhost
# default: system/storage/<name>
#mqtt-topic=system/storage/nas
